services:
  - type: web
    name: one-missing-question
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_BASE_URL
        fromService:
          type: pserv
          name: one-missing-question-model
          property: hostport
      - key: OLLAMA_MODEL
        value: gemma2:2b-instruct-q3_K_S

  - type: pserv
    name: one-missing-question-model
    runtime: docker
    dockerfilePath: ./Dockerfile.model
    plan: 1c-2g
    envVars:
      - key: OLLAMA_HOST
        value: 0.0.0.0:11434
      - key: OLLAMA_MODEL
        value: gemma2:2b-instruct-q3_K_S
      - key: OLLAMA_KEEP_ALIVE
        value: '-1'
    disk:
      name: model-data
      mountPath: /root/.ollama
      sizeGB: 3
